[project]
name = "example"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "celery>=5.6.3",
    "coverage>=7.14.0",
    "fastapi>=0.135.3",
    "flower>=2.0.1",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "mypy>=2.1.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.13.1",
    "pydantic[email]>=2.12.5",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "redis>=8.0.1",
    "ruff>=0.15.18",
    "sqladmin>=0.25.0",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.44.0",
]


[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ["UP", "I", "E", "W", "F", "B", "FURB", "S", "T20", "ERA"]
exclude = ["src/app/tests/**"]
ignore = ["W293"]

[tool.ruff.lint.per-file-ignores]
"app/routers/**" = ["F403", "F405"] 

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]


[tool.ruff.format]
quote-style = "double"

